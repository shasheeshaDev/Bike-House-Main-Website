<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article — Bike House</title>
<meta name="description" content="Notes and stories from the workshop floor.">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/main.css">
<style>
  .post-hero {
    padding-top: 140px;
    padding-bottom: 56px;
    border-bottom: 1px solid var(--line-soft);
  }
  .post-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 24px;
  }
  .post-meta .red { color: var(--red); }
  .post-title {
    font-size: clamp(48px, 7vw, 96px);
    line-height: .92;
    max-width: 18ch;
  }
  .post-cover {
    aspect-ratio: 16 / 9;
    background-size: cover;
    background-position: center;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
  }
  .post-body {
    max-width: 70ch;
    margin: 80px auto;
    padding: 0 var(--gutter);
  }
  .post-body p {
    font-size: 18px;
    line-height: 1.7;
    color: var(--ink-dim);
    margin: 0 0 28px;
  }
  .post-body p:first-of-type::first-letter {
    font-family: var(--font-display);
    color: var(--red);
    font-size: 4.2em;
    float: left;
    line-height: .9;
    padding: 6px 14px 0 0;
  }
  .post-body p strong { color: var(--ink); }

  .post-share {
    max-width: 70ch;
    margin: 56px auto 0;
    padding: 32px var(--gutter) 0;
    border-top: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .post-share .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; color: var(--ink-mute); text-transform: uppercase; }
  .post-share .links { display: flex; gap: 10px; }
  .post-share .links a {
    width: 38px; height: 38px;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    border-radius: 50%;
    transition: border-color .25s, background .25s;
  }
  .post-share .links a:hover { border-color: var(--red); background: rgba(225,6,0,.1); }
  .post-share svg { width: 14px; height: 14px; }

  .author-block {
    max-width: 70ch;
    margin: 56px auto 0;
    padding: 32px var(--gutter) 0;
    border-top: 1px solid var(--line-soft);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .author-block .av {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red), #5a0200);
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    color: #fff;
    font-size: 22px;
    flex-shrink: 0;
  }
  .author-block .name { font-family: var(--font-display); font-size: 22px; line-height: 1; }
  .author-block .role { font-family: var(--font-mono); font-size: 11px; letter-spacing: .15em; color: var(--ink-mute); text-transform: uppercase; margin-top: 6px; }
</style>
</head>
<body data-page="blog">

<article>
  <section class="post-hero" id="postHero">
    <div class="container">
      <div class="crumbs">Home <span>/</span> <a href="blog.html">Journal</a> <span>/</span> <span id="crumbTitle">…</span></div>
      <div id="postHeader"></div>
    </div>
  </section>

  <div class="post-cover" id="postCover"></div>

  <div class="post-body" id="postBody"></div>

  <div class="post-share">
    <span class="label">Share this article</span>
    <div class="links">
      <a href="#" aria-label="Twitter / X"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h3l-7 8 8 12h-6l-5-7-6 7H2l8-9L2 2h6l4 6 6-6Z"/></svg></a>
      <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 8H6v4h3v8h4v-8h3l1-4h-4V6.5C13 5.5 13.5 5 14.5 5H17V1h-3c-3 0-5 1.8-5 5v2Z"/></svg></a>
      <a href="https://wa.me/94771234567" aria-label="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.7-1-2.3-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.3-.7.3-1.2.2-1.4-.1-.1-.3-.2-.6-.3ZM12 2C6.5 2 2 6.5 2 12c0 1.9.5 3.6 1.4 5.1L2 22l5-1.3c1.4.8 3.1 1.3 5 1.3 5.5 0 10-4.5 10-10S17.5 2 12 2Z"/></svg></a>
    </div>
  </div>

  <div class="author-block">
    <div class="av" id="authorAv">S</div>
    <div>
      <div class="name" id="authorName">Supun Chaturanga</div>
      <div class="role">Co-Founder · Bike House</div>
    </div>
  </div>
</article>

<!-- RELATED -->
<section class="section" style="background:var(--bg-soft); margin-top:120px;">
  <div class="container">
    <div class="section-head">
      <div>
        <div class="label">[ Keep Reading ]</div>
        <h2 class="h2">More from<br>the workshop.</h2>
      </div>
      <div class="meta"><a href="blog.html" style="color:var(--ink);">All Articles →</a></div>
    </div>
    <div class="blog-grid" id="relatedGrid"></div>
  </div>
</section>

<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
  const D = window.BH_DATA;
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const post = D.posts.find(p => p.id === id);

  if (!post) {
    document.getElementById("postHeader").innerHTML = `
      <h1 style="font-family:var(--font-display); font-size:120px; color:var(--ink-mute); text-transform:uppercase;">404</h1>
      <p style="margin-top:14px;">Article not found. <a href="blog.html" style="color:var(--red); border-bottom:1px solid var(--red);">Browse the Journal →</a></p>
    `;
    document.getElementById("postCover").style.display = "none";
    document.getElementById("postBody").style.display = "none";
    document.querySelectorAll(".post-share, .author-block").forEach(el => el.style.display = "none");
  } else {
    document.title = `${post.title} — Bike House Journal`;
    document.getElementById("crumbTitle").textContent = post.title;

    // Alternating authors for variety
    const authors = [
      { name: "Supun Chaturanga", initial: "S" },
      { name: "Kasun Chathuranga", initial: "K" },
    ];
    const author = authors[post.id.charCodeAt(1) % 2];

    document.getElementById("postHeader").innerHTML = `
      <div class="post-meta"><span class="red">${post.cat}</span> · ${post.date} · ${post.read} · by ${author.name}</div>
      <h1 class="post-title">${post.title}</h1>
    `;
    document.getElementById("postCover").style.backgroundImage = `url('${post.img}')`;
    document.getElementById("postBody").innerHTML = post.body.map(p => `<p>${p}</p>`).join("");
    document.getElementById("authorAv").textContent = author.initial;
    document.getElementById("authorName").textContent = author.name;

    // Related — other posts
    const related = D.posts.filter(p => p.id !== id).slice(0, 3);
    document.getElementById("relatedGrid").innerHTML = related.map(p => `
      <a class="blog-card" href="post.html?id=${p.id}">
        <div class="img" style="background-image:url('${p.img}')"></div>
        <div class="meta"><span class="red">${p.cat}</span> · ${p.date}</div>
        <h4>${p.title}</h4>
        <p class="excerpt">${p.excerpt}</p>
      </a>
    `).join("");
  }
</script>
</body>
</html>
